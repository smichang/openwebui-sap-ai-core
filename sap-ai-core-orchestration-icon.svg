<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>AI Core Orchestration</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a6ed1"/>
      <stop offset="1" stop-color="#1b2a6b"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="190" fill="#1a5bb0"/>
  <circle cx="256" cy="256" r="150" fill="#2469bd"/>

  <!-- orbit ring -->
  <circle cx="256" cy="256" r="138" fill="none" stroke="#8fb8e8" stroke-width="4" stroke-dasharray="4 14" stroke-linecap="round"/>

  <!-- spokes from hub to model nodes -->
  <g stroke="#dbe9fb" stroke-width="8" stroke-linecap="round">
    <line x1="256" y1="256" x2="256" y2="118"/>
    <line x1="256" y1="256" x2="375" y2="325"/>
    <line x1="256" y1="256" x2="137" y2="325"/>
  </g>

  <!-- model nodes -->
  <g fill="#ffffff">
    <circle cx="256" cy="118" r="30"/>
    <circle cx="375" cy="325" r="30"/>
    <circle cx="137" cy="325" r="30"/>
  </g>
  <g fill="#0a6ed1">
    <circle cx="256" cy="118" r="12"/>
    <circle cx="375" cy="325" r="12"/>
    <circle cx="137" cy="325" r="12"/>
  </g>

  <!-- central hub with spark -->
  <circle cx="256" cy="256" r="60" fill="#ffffff"/>
  <path d="M256 214 L267 245 L298 256 L267 267 L256 298 L245 267 L214 256 L245 245 Z" fill="#0a6ed1"/>
</svg>
